<section class="ui-card">
    <header class="ui-card-header">
        <div>
            <h2 class="ui-card-titulo">Gráficos</h2>
            <p class="ui-card-subtitulo">Últimos {{ graficos_abastecimento|length }} meses até {{ mes_abastecimento|date:"M/Y" }}</p>
        </div>
    </header>

    <div class="ui-grid-2">
        <div>
            <h3 class="ui-secao-titulo">Gasto mensal (R$)</h3>
            <div class="ui-grafico">
                <canvas id="grafico-abastecimento-gasto" role="img"
                        aria-label="Gráfico de colunas do gasto mensal com abastecimento"></canvas>
            </div>
        </div>
        <div>
            <h3 class="ui-secao-titulo">Preço médio do litro (R$/L)</h3>
            <div class="ui-grafico">
                <canvas id="grafico-abastecimento-preco" role="img"
                        aria-label="Gráfico de linha do preço médio do litro por mês"></canvas>
            </div>
        </div>
    </div>
    {{ graficos_abastecimento|json_script:"dados-graficos-abastecimento" }}
</section>
