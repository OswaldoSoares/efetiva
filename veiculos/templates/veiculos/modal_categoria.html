<form class="row g-3 ui-form" method="post" action="{% url 'categoria_veiculo_form' %}">
    {% csrf_token %}
    {% if categoria %}
        <input type="hidden" name="id_categoria_form" value="{{ categoria.pk }}">
    {% endif %}
    {% for field in form %}
        <div class="col-md-6">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}:</label>
            {{ field }}
            {% if field.errors %}
                <ul class="errorlist">
                    {% for error in field.errors %}
                        <li><strong>{{ error|escape }}</strong></li>
                    {% endfor %}
                </ul>
            {% endif %}
        </div>
    {% endfor %}
    <button type="submit" class="ui-submit-oculto" tabindex="-1" aria-hidden="true"></button>
</form>
